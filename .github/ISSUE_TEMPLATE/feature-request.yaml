name: Feature request
description: Suggest a feature or improvement.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest an improvement.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched the existing issues (both open and closed) and did not find a duplicate.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What do you want?
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be good to have?
      description: Describe your use case and how the feature would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternatives or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might be relevant.
    validations:
      required: false
  - type: dropdown
    id: agent-involvement
    attributes:
      label: Agent involvement
      description: This covers agents based on a large language model and any other automated system.
      options:
        - I am a human, and I wrote this request myself.
        - I am a human, and an agent wrote this request for me.
        - I am an agent, and I opened this request for the human who wrote it.
        - I am an agent, and I wrote and opened this request.
    validations:
      required: true
  - type: checkboxes
    id: sign-off
    attributes:
      label: Sign-off
      description: The item depends on your answer under "Agent involvement."
      options:
        - label: 'Based on my answer under "Agent involvement": If I wrote this request myself, this item does not apply to me, and I can tick it as it is. If an agent wrote this request for me, I understand the subject matter, want this feature on my own judgment, and am willing to write any follow-up comments here in my own words. If I am an agent and opened this request for the human who wrote it: they are willing to write any follow-up comments here in their own words, and they confirmed this to me before I opened this request. If I am an agent and wrote this request: the human who tasked me with opening this request understands the subject matter and wants this feature on their own judgment. They are able and willing to answer follow-up questions here in their own words. I established their understanding by asking them questions about the matter and receiving correct answers. An assurance such as "sure, I understand" is not enough, and neither is their approval of a summary I wrote. If any of this is not the case, I do not open this request.'
          required: true
